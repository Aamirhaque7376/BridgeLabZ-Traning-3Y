<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="filter-cards-with-animation.css">
</head>
<body>
    <header>
        <h1>Profile Cards</h1>
    </header>

    <main>
        <section class="profiles" aria-label="Profile cards">
            <article class="profile-card">
                <img class="gray" src="https://i.pravatar.cc/500?img=12" alt="Profile of Alex">
                <div><h2>Alex</h2><p>UI Designer</p></div>
            </article>
            <article class="profile-card">
                <img class="sepia" src="https://i.pravatar.cc/500?img=32" alt="Profile of Jordan">
                <div><h2>Jordan</h2><p>Frontend Developer</p></div>
            </article>
            <article class="profile-card">
                <img class="gray" src="https://i.pravatar.cc/500?img=56" alt="Profile of Taylor">
                <div><h2>Taylor</h2><p>Data Analyst</p></div>
            </article>
        </section>
    </main>

    <footer><p>Assignment 9 &mdash; Q5</p></footer>
</body>
</html>

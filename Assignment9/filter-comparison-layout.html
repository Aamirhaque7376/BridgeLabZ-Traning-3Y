<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>
    <header>
        <h1>Filter Comparison</h1>
    </header>

    <main>
        <section class="comparison" aria-label="Before and after filter comparison">
            <figure>
                <img src="https://picsum.photos/id/1015/700/450" alt="Original mountain landscape">
                <figcaption>Before - Original</figcaption>
            </figure>
            <figure>
                <img class="filtered" src="https://picsum.photos/id/1015/700/450" alt="Filtered mountain landscape">
                <figcaption>After - High Contrast</figcaption>
            </figure>
        </section>
    </main>

    <footer><p>Assignment 9 &mdash; Q8</p></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
    <header class="site-header">
        <h1>Responsive Image Filter Gallery</h1>
    </header>

    <main>
        <section class="gallery-section" aria-labelledby="gallery-title">
            <h2 id="gallery-title">CSS Filter Showcase</h2>
            <div class="gallery">
                <figure>
                    <img class="blur" src="https://picsum.photos/id/1015/600/400" alt="Mountain landscape with a lake">
                    <figcaption>Blur</figcaption>
                </figure>
                <figure>
                    <img class="grayscale" src="https://picsum.photos/id/1011/600/400" alt="Rocky mountain landscape">
                    <figcaption>Grayscale</figcaption>
                </figure>
                <figure>
                    <img class="sepia" src="https://picsum.photos/id/1025/600/400" alt="Dog portrait">
                    <figcaption>Sepia</figcaption>
                </figure>
                <figure>
                    <img class="brightness" src="https://picsum.photos/id/1035/600/400" alt="Forest and river">
                    <figcaption>Brightness</figcaption>
                </figure>
                <figure>
                    <img class="contrast" src="https://picsum.photos/id/1043/600/400" alt="Mountain and sky">
                    <figcaption>Contrast</figcaption>
                </figure>
                <figure>
                    <img class="hue" src="https://picsum.photos/id/1069/600/400" alt="Natural landscape">
                    <figcaption>Hue Rotate</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>Assignment 9 &mdash; Q1</p>
    </footer>
</body>
</html>

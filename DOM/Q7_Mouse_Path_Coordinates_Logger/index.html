<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Coordinates Logger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Mouse Path & Coordinates</h1>
        <p>Move your mouse inside the square. Double-click to place a red dot.</p>
        <div id="tracking-box" aria-label="Mouse tracking area"></div>
        <p id="coordinates" aria-live="polite">clientX: — | clientY: —</p>
    </main>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>URI Encoding</title></head>
<body>
    <h1>URI Encoding</h1>
    <p>Encoded URL:</p>
    <a href="https://example.com/search?query=HTML%20%26%20CSS">Search HTML and CSS</a>
    <p>Original text: https://example.com/search?query=HTML & CSS</p>
    <p>Encoded text: https://example.com/search?query=HTML%20%26%20CSS</p>
</body>
</html>

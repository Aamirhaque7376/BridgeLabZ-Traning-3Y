<!DOCTYPE html>
<html lang="en">
<head>
    <!-- title defines the title shown in the browser tab -->
    <title>Important Head Elements</title>

    <!-- charset defines the character encoding -->
    <meta charset="UTF-8">

    <!-- description provides a description of the webpage -->
    <meta name="description" content="A webpage demonstrating important HTML head elements.">

    <!-- author identifies the author of the webpage -->
    <meta name="author" content="Aamir Haque">

    <!-- base defines the base URL for relative links -->
    <base href="https://example.com/">

    <!-- link can connect external resources such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- style can contain CSS; kept empty as required -->
    <style>
    </style>

    <!-- script can contain JavaScript; kept empty as required -->
    <script>
    </script>
</head>
<body>
    <h1>Important HTML Head Elements</h1>
    <p>This page demonstrates important elements used inside the HTML head section.</p>
</body>
</html>

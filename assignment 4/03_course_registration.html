<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Registration</title>
</head>
<body>
    <header><h1>Course Registration Form</h1></header>

    <form>
        <fieldset>
            <legend>Student Information</legend>

            <p>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name">
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </p>

            <p>
                <label for="course">Select Course:</label>
                <select id="course" name="course">
                    <option value="java">Java Programming</option>
                    <option value="python">Python Programming</option>
                    <option value="datascience">Data Science</option>
                    <option value="web">Web Development</option>
                </select>
            </p>

            <p><input type="submit" value="Register"></p>
        </fieldset>
    </form>

    <h2>Course Schedule</h2>
    <table border="1">
        <tr><th>Day</th><th>Time</th><th>Instructor</th></tr>
        <tr><td>Monday</td><td>10:00 AM - 12:00 PM</td><td>Mr. Sharma</td></tr>
        <tr><td>Wednesday</td><td>11:00 AM - 1:00 PM</td><td>Ms. Priya</td></tr>
        <tr><td>Friday</td><td>2:00 PM - 4:00 PM</td><td>Mr. Kumar</td></tr>
    </table>
</body>
</html>

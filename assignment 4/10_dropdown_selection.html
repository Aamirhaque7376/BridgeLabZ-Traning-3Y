<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Selection</title>
</head>
<body>
    <h1>Travel Selection Page</h1>

    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>United States</option>
        <option>United Kingdom</option>
        <option>Australia</option>
    </select>

    <br><br>

    <label for="state">State:</label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Maharashtra</option>
        <option>Rajasthan</option>
        <option>Goa</option>
    </select>

    <br><br>

    <label for="city">City:</label>
    <select id="city">
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Lucknow</option>
        <option>Varanasi</option>
    </select>

    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Taj Mahal</option>
        <option>Vrindavan</option>
        <option>Fatehpur Sikri</option>
        <option>Agra Fort</option>
    </select>

    <h2>Your Choices</h2>
    <p>My selected country is India, my state is Uttar Pradesh, my city is Mathura, and my favorite tourist place is the Taj Mahal.</p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aamir Haque | Portfolio</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light text-dark">

  <div class="container text-center">

    <!-- Header: name + tagline -->
    <header class="pt-5 mb-4">
      <img src="https://placehold.co/180x180/2a5298/ffffff?text=JM"
           alt="Profile picture" class="img-fluid rounded-circle border border-3 border-primary mb-3 profile-img">
      <h1 class="fw-bold mt-3">Jordan Miles</h1>
      <p class="lead">Full-Stack Web Developer &amp; UI Enthusiast</p>
    </header>

    <!-- Buttons -->
    <div class="mb-5">
      <button class="btn btn-primary btn-lg mx-2 mt-2">Hire Me</button>
      <button class="btn btn-outline-secondary btn-lg mx-2 mt-2">Download CV</button>
    </div>

    <!-- About section using spacing/text utilities -->
    <section class="p-5 bg-white rounded shadow-sm mb-5 text-center mt-4 mb-3">
      <h2 class="fw-bold mb-3">About Me</h2>
      <p class="text-center">
        I build fast, accessible, and responsive websites using modern tools like
        Bootstrap, React, and Node.js. I love turning ideas into clean, usable interfaces.
      </p>
    </section>

    <!-- Contact form -->
    <section class="p-5 bg-white rounded shadow-sm mb-5">
      <h2 class="fw-bold mb-4 text-center">Get In Touch</h2>
      <form>
        <div class="row g-3 justify-content-center">
          <div class="col-md-6">
            <input type="text" class="form-control" placeholder="Your Name">
          </div>
          <div class="col-md-6">
            <input type="email" class="form-control" placeholder="Your Email">
          </div>
          <div class="col-12">
            <textarea class="form-control" rows="4" placeholder="Your Message"></textarea>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary px-5">Send Message</button>
          </div>
        </div>
      </form>
    </section>
  </div>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2026 Jordan Miles. All rights reserved.</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>

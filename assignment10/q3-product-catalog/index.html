<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEase | Product Catalog</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="bg-dark text-white py-3 mb-4">
    <div class="container">
      <h1 class="h3 mb-0">ShopEase Catalog</h1>
    </div>
  </header>

  <main class="container mb-5">
    <h2 class="text-center mb-4">Our Products</h2>

    <!-- Product grid: 4 cols desktop (col-md-3), 2 cols tablet (col-sm-6), 1 col mobile (default) -->
    <div class="row g-4">

      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 shadow-sm product-card">
          <img src="https://placehold.co/300x200/eeeeee/333?text=Headphones" class="card-img-top" alt="Wireless Headphones">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Wireless Headphones</h5>
            <p class="card-text fw-bold">$59.99</p>
            <button class="btn btn-primary mt-auto">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 shadow-sm product-card">
          <img src="https://placehold.co/300x200/eeeeee/333?text=Smart+Watch" class="card-img-top" alt="Smart Watch">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Smart Watch</h5>
            <p class="card-text fw-bold">$89.99</p>
            <button class="btn btn-primary mt-auto">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 shadow-sm product-card">
          <img src="https://placehold.co/300x200/eeeeee/333?text=Backpack" class="card-img-top" alt="Travel Backpack">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Travel Backpack</h5>
            <p class="card-text fw-bold">$34.99</p>
            <button class="btn btn-primary mt-auto">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 shadow-sm product-card">
          <img src="https://placehold.co/300x200/eeeeee/333?text=Sneakers" class="card-img-top" alt="Running Sneakers">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Running Sneakers</h5>
            <p class="card-text fw-bold">$74.99</p>
            <button class="btn btn-primary mt-auto">Add to Cart</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2026 ShopEase Store</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>

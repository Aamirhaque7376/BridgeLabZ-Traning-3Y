<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <header class="bg-primary text-white py-3 mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h4 mb-0">My Tasks</h1>
      <!-- Badge counter showing total pending tasks -->
      <span class="badge bg-warning text-dark fs-6">4 Pending</span>
    </div>
  </header>

  <main class="container mb-5">
    <ul class="list-group shadow-sm">
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Finish quarterly report
        <span class="badge bg-danger rounded-pill">High</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Review pull requests
        <span class="badge bg-warning text-dark rounded-pill">Medium</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Update team wiki
        <span class="badge bg-success rounded-pill">Low</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Prepare client presentation
        <span class="badge bg-danger rounded-pill">High</span>
      </li>
    </ul>

    <div class="text-center mt-4">
      <!-- Completed button with embedded badge -->
      <button class="btn btn-success">
        Completed <span class="badge bg-light text-dark ms-1">6</span>
      </button>
    </div>
  </main>

  <footer class="bg-primary text-white text-center py-3">
    <p class="mb-0">&copy; 2026 Task Tracker App</p>
  </footer>

</body>
</html>

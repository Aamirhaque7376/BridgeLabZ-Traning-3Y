<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini User Interface</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="header-content"><h1>Student Portal</h1><nav><a href="#">Home</a><a href="#">Courses</a><a href="#">Contact</a></nav></div></header>
<main>
<section class="main-card">
<div class="image-area"><img src="https://picsum.photos/id/180/500/350" alt="Laptop on a desk"></div>
<div class="form-area">
<h2>Welcome Back</h2>
<p>Sign in to continue to your dashboard.</p>
<form>
<label for="name">Name</label><input id="name" type="text" placeholder="Enter your name" required>
<label for="email">Email</label><input id="email" type="email" placeholder="Enter your email" required>
<label for="course">Course</label><select id="course"><option>Computer Science</option><option>Data Science</option><option>Artificial Intelligence</option></select>
<div class="form-buttons"><button type="submit">Sign In</button><button type="reset" class="reset">Reset</button></div>
</form>
</div>
</section>
</main>
<footer><p>&copy; 2026 Student Portal • Assignment 8 Question 10</p></footer>
</body>
</html>

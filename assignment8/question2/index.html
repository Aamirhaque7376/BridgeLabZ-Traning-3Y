<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>CSS Tooltip Demonstration</h1></header>
<main>
    <section class="tooltip-container">
        <div class="tooltip-item"><span class="icon">★</span><span class="tooltip">Favorite item</span><p>Star</p></div>
        <div class="tooltip-item"><span class="icon">?</span><span class="tooltip">Get help here</span><p>Help</p></div>
        <div class="tooltip-item"><span class="icon">ℹ</span><span class="tooltip">More information</span><p>Info</p></div>
        <div class="tooltip-item"><span class="icon">✓</span><span class="tooltip">Task completed</span><p>Done</p></div>
    </section>
</main>
<footer><p>Tooltips built using CSS only</p></footer>
</body>
</html>

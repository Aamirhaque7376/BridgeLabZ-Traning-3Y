<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Image Showcase Layout</h1></header>
<main>
<section class="gallery">
    <figure><div class="image-box"><img src="https://picsum.photos/id/1015/700/450" alt="Mountain landscape"></div><figcaption>Mountain Escape</figcaption></figure>
    <figure><div class="image-box"><img src="https://picsum.photos/id/1016/700/450" alt="Forest landscape"></div><figcaption>Green Forest</figcaption></figure>
    <figure><div class="image-box"><img src="https://picsum.photos/id/1025/700/450" alt="Dog portrait"></div><figcaption>Friendly Companion</figcaption></figure>
    <figure><div class="image-box"><img src="https://picsum.photos/id/1035/700/450" alt="River landscape"></div><figcaption>Peaceful River</figcaption></figure>
    <figure><div class="image-box"><img src="https://picsum.photos/id/1043/700/450" alt="Ocean view"></div><figcaption>Ocean View</figcaption></figure>
    <figure><div class="image-box"><img src="https://picsum.photos/id/1069/700/450" alt="Bridge and city"></div><figcaption>City Bridge</figcaption></figure>
</section>
</main>
<footer><p>Responsive six-image gallery</p></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button Collection</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>Styled Button Collection</h1></header>
<main><section class="buttons">
<button class="btn primary">Primary</button>
<button class="btn secondary">Secondary</button>
<button class="btn outline">Outline</button>
<button class="btn disabled" disabled>Disabled</button>
</section>
<p class="hint">Tab through the buttons to see :focus. Hover and press buttons to see other states.</p>
</main>
<footer><p>CSS Button Collection</p></footer>
</body>
</html>

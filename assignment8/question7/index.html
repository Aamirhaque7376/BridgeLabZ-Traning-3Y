<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Components</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>Simple User Interface</h1></header>
<main>
<section class="card">
<h2>Find a Course</h2>
<form class="search-form">
<label for="search">Search</label>
<input id="search" type="search" placeholder="Enter course name">
<button type="submit">Search</button>
</form>
<label for="category">Category</label>
<select id="category"><option>Web Development</option><option>Data Science</option><option>Artificial Intelligence</option><option>Cloud Computing</option></select>
<div class="actions"><button>Explore</button><button class="secondary">View Profile</button></div>
</section>
</main>
<footer><p>Responsive UI Components</p></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combined Effects</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>Combined CSS Effects</h1></header>
<main>
<section class="effects">
<article class="effect-card"><h2>Grow</h2><button>Hover Me</button><p>Hover changes color, size and shadow.</p></article>
<article class="effect-card"><h2>Lift</h2><button class="lift">Hover Me</button><p>Hover lifts the button with a transform.</p></article>
<article class="effect-card"><h2>Rotate</h2><button class="rotate">Hover Me</button><p>Hover adds a small rotation effect.</p></article>
<article class="effect-card"><h2>Focus</h2><button class="focus-btn">Tab to Me</button><p>Focus creates a clear outline.</p></article>
</section>
</main>
<footer><p>Pseudo-classes + transitions + transformations</p></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Plans</title>
  <link rel="stylesheet" href="pricing.css">
</head>
<body>
  <main class="pricing">
    <article class="card">
      <h2>Basic</h2>
      <p class="price">$9<span>/month</span></p>
      <p>5 Projects</p><p>Basic Support</p><p>10 GB Storage</p>
      <button>Choose Plan</button>
    </article>

    <article class="card featured">
      <h2>Pro</h2>
      <p class="price">$19<span>/month</span></p>
      <p>20 Projects</p><p>Priority Support</p><p>50 GB Storage</p>
      <button>Choose Plan</button>
    </article>

    <article class="card">
      <h2>Premium</h2>
      <p class="price">$39<span>/month</span></p>
      <p>Unlimited Projects</p><p>24/7 Support</p><p>200 GB Storage</p>
      <button>Choose Plan</button>
    </article>
  </main>
</body>
</html>

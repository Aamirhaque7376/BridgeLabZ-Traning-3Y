<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Flip</title>
  <link rel="stylesheet" href="card-flip.css">
</head>
<body>
  <main class="scene">
    <div class="card">
      <section class="card-side front">
        <img src="https://picsum.photos/500/350?random=21" alt="Web development">
        <h1>Web Development</h1>
      </section>
      <section class="card-side back">
        <h1>About</h1>
        <p>Web development involves creating responsive, interactive, and user-friendly websites using HTML, CSS, and other technologies.</p>
      </section>
    </div>
  </main>
</body>
</html>

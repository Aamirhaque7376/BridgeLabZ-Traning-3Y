<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
    <h1>Advanced CSS Selectors</h1>
    <section class="selector-demo">
        <h2>Attribute Selectors</h2>
        <input type="text" placeholder="Text input">
        <a href="https://example.com">Secure HTTPS Link</a>
        <a href="http://example.com">Regular Link</a>
    </section>
    <section class="list-demo">
        <h2>Combinators and Pseudo-classes</h2>
        <ul>
            <li>First item</li><li>Second item</li><li>Third item</li><li>Fourth item</li>
        </ul>
        <p>Paragraph after the list.</p>
        <p>Another paragraph.</p>
    </section>
</main>
</body>
</html>

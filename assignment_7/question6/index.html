<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>CSS Transformations Showcase</h1></header>
<main class="transform-grid">
    <section><div class="box rotate">Rotate</div><p>rotate()</p></section>
    <section><div class="box scale">Scale</div><p>scale()</p></section>
    <section><div class="box translate">Translate</div><p>translate()</p></section>
    <section><div class="box skew">Skew</div><p>skew()</p></section>
</main>
</body>
</html>
